[pytest]
DJANGO_SETTINGS_MODULE = backend.settings_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths =
    accounts/tests
    projects/tests
    workflow/tests
    project_management/tests
    notifications/tests
    grades/tests
    committees/tests
    project_imports/tests
    gitlab_integration/tests
    dy_forms/tests
    tests
addopts =
    -ra
    --strict-config
    --strict-markers
    --import-mode=importlib
    --tb=short
markers =
    unit: Fast tests for one model, serializer, validator, or service.
    api: HTTP API behavior tests.
    integration: Tests spanning multiple applications or layers.
    security: Authentication, authorization, throttling, and data-isolation tests.
    smoke: Critical checks that verify the test environment and core endpoints.
    slow: Tests excluded from the default fast feedback loop when requested.
    external: Tests that emulate or integrate with an external service.
filterwarnings =
    default
